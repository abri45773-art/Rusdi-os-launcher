<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rusdi jmk48">
  <title>Rusdi jmk48 OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
</head>
<body>
  <!-- Boot Screen -->
  <div id="boot-screen">
    <div class="boot-logo">
      <div class="boot-icon">◈</div>
      <h1>Rusdi jmk48</h1>
      <p class="boot-sub">Lightweight OS</p>
      <div class="boot-loader"><div class="boot-bar"></div></div>
      <p class="boot-hint">Memuat sistem...</p>
    </div>
  </div>

  <!-- Lock Screen -->
  <div id="lock-screen" class="hidden">
    <div class="lock-clock">
      <div id="lock-time">00:00</div>
      <div id="lock-date">Senin, 1 Januari</div>
    </div>
    <div class="lock-unlock" id="lock-unlock">
      <div class="lock-icon">🔓</div>
      <span>Geser untuk membuka</span>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop" class="hidden">
    <!-- Desktop Icons -->
    <div id="desktop-icons"></div>

    <!-- Windows Container -->
    <div id="windows-container"></div>

    <!-- Start Menu -->
    <div id="start-menu" class="hidden">
      <div class="start-header">
        <div class="start-user">
          <div class="start-avatar">R</div>
          <div>
            <div class="start-name">Pengguna Rusdi</div>
            <div class="start-email">user@rusdi.os</div>
          </div>
        </div>
        <button class="start-power" id="power-btn" title="Matikan">⏻</button>
      </div>
      <div class="start-apps" id="start-apps"></div>
      <div class="start-search">
        <input type="text" id="search-input" placeholder="Cari aplikasi..." autofocus>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="hidden"></div>

    <!-- Taskbar -->
    <div id="taskbar">
      <button id="start-btn" class="taskbar-btn">
        <span class="start-logo">◈</span>
        <span class="start-label">Rusdi</span>
      </button>
      <div id="taskbar-apps"></div>
      <div class="taskbar-right">
        <span id="taskbar-wifi">📶</span>
        <span id="taskbar-battery">🔋</span>
        <span id="taskbar-clock">00:00</span>
      </div>
    </div>
  </div>

  <script src="js/wm.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
